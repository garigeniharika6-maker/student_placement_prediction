<!DOCTYPE html>
<html>
<head>
    <title>Student Placement Predictor</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 0 15px #ccc;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Placement Predictor</h1>

    <form method="POST">

        <label>CGPA</label>
        <input type="number" step="0.1" name="cgpa" required>

        <label>Internships</label>
        <input type="number" name="internships" required>

        <label>Projects</label>
        <input type="number" name="projects" required>

        <label>Aptitude Score</label>
        <input type="number" step="0.1" name="aptitude" required>

        <label>Communication Score</label>
        <input type="number" step="0.1" name="communication" required>

        <button type="submit">Predict Placement</button>

    </form>

    {% if prediction %}

    <div class="result">
        Prediction: {{ prediction }}

        <br><br>

        Probability:
        {{ "%.2f"|format(probability) }}%

    </div>

    {% endif %}

</div>

</body>
</html>
